; Repository: https://github.com/youreverest/Proxy-Config
; Format: Subconverter external configuration (INI)

[custom]

; ============================================================
; Proxy groups
; ============================================================
; SELECT: main policy group
; ALL: all subscription proxy nodes
; Regional groups: load-balance (consistent-hashing) health checks every 900 seconds
; Note: Subconverter INI cannot conditionally hide a group when
;       no node matches its filter. Regional groups are therefore
;       always declared.

custom_proxy_group=SELECT`select`[]🇺🇳 ALL`[]DIRECT`[]🇹🇼 ROC`[]🇭🇰 HKG`[]🇯🇵 JPN`[]🇰🇷 KOR`[]🇸🇬 SGP`[]🇺🇸 USA

custom_proxy_group=🇺🇳 ALL`select`.*
custom_proxy_group=🇹🇼 ROC`load-balance`([Tt][Ww]|[Tt][Aa][Ii][Ww][Aa][Nn]|[Rr][Oo][Cc]|台湾|台灣|臺灣|湾|灣|中华|中華|民国|民國|🇹🇼)`[]DIRECT`http://www.gstatic.com/generate_204`900
custom_proxy_group=🇭🇰 HKG`load-balance`(香港|[Hh][Kk]|[Hh]ong[ ]?[Kk]ong|[Hh]ong|港|🇭🇰)`[]DIRECT`http://www.gstatic.com/generate_204`900
custom_proxy_group=🇯🇵 JPN`load-balance`(日本|[Jj][Pp]|[Jj][Aa][Pp][Aa][Nn]|日|🇯🇵)`[]DIRECT`http://www.gstatic.com/generate_204`900
custom_proxy_group=🇰🇷 KOR`load-balance`(韩国|[Kk][Rr]|[Kk][Oo][Rr][Ee][Aa]|韩|韓|🇰🇷)`[]DIRECT`http://www.gstatic.com/generate_204`900
custom_proxy_group=🇸🇬 SGP`load-balance`(新加坡|[Ss][Gg]|[Ss][Ii][Nn][Gg][Aa][Pp][Oo][Rr][Ee]|新|坡|狮|獅|🇸🇬)`[]DIRECT`http://www.gstatic.com/generate_204`900
custom_proxy_group=🇺🇸 USA`load-balance`(美国|[Uu][Ss]|[Uu][Ss][Aa]|[Uu]nited[ ]?[Ss]tates|[Uu]nited|[Ss]tates|[Aa]merica|美|米|🇺🇸)`[]DIRECT`http://www.gstatic.com/generate_204`900

